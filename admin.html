<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – AJE Coins</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="admin.js"></script>
</head>
<body>

<header class="topBar">
    <img src="assets/logo.png" class="logo" alt="Logo">
    <span>Panel Administrativo – AJE Coins</span>
</header>

<main class="main-container">

    <section class="card">
        <h2>📁 Carga de Datos</h2>
        <div style="display: grid; gap: 10px; margin-top:10px;">
            <div>
                <label>Usuarios (CSV):</label>
                <input type="file" id="fileInput" accept=".csv">
                <button id="uploadBtn">Cargar Usuarios</button>
            </div>
            <hr>
            <div>
                <label>Productos (CSV):</label>
                <input type="file" id="productFileInput" accept=".csv">
                <button id="uploadProductBtn">Cargar Productos</button>
            </div>
        </div>
    </section>

    <section class="card-wide">
        <h2>📦 Inventario de Productos</h2>
        <table id="productsTable">
            <thead>
                <tr><th>Producto</th><th>Imagen</th><th>Coins</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section class="card-wide">
        <h2>👥 Usuarios y Cargas de Coins</h2>
        <div style="margin-bottom: 10px;">
            <button id="btnExportUsers" style="width: auto; background: #546e7a;">Exportar Usuarios CSV</button>
        </div>
        <table id="usersTable">
            <thead>
                <tr><th>Fecha</th><th>Código</th><th>Nombre</th><th>Cedis</th><th>Coins</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section class="card-wide">
        <h2>📊 Movimientos y Saldos por Usuario</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="movCedula" placeholder="Código de Vendedor">
            <button id="btnVerMov" style="width: 150px;">Consultar</button>
            <button id="btnVerTodosMov" style="width: 150px; background: #546e7a;">Ver Todos</button>
            <button id="btnExportMov" style="width: 150px; background: #546e7a;">Exportar</button>
        </div>
        <table id="movTable">
            <thead>
                <tr><th>Código</th><th>Nombre</th><th>Cedis</th><th>Fecha</th><th>Concepto</th><th>Coins</th><th>Saldo</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section class="card-wide">
        <h2>🛒 Historial de Canjes</h2>
        <div style="margin-bottom: 10px;">
            <button id="btnExport" style="width: auto; background: #546e7a;">Exportar Compras CSV</button>
        </div>
        <table id="comprasTable">
            <thead>
                <tr><th>Fecha</th><th>Código</th><th>Nombre</th><th>Cedis</th><th>Productos</th><th>Total</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

</main>

</body>
</html>
